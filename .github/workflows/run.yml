name: Run Python Automation

# 트리거 설정 (main 브랜치에 push될 때 실행)
on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 활성화

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 코드를 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Python 환경 설정
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 필요한 라이브러리 설치 (필요 시)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install pandas requests 등 필요한 패키지 추가 가능

    # 4. Python 스크립트 실행 (Secrets 변수 전달)
    - name: Execute Python script
      env:
        MY_API_KEY: ${{ secrets.MY_API_KEY }}
      run: |
        python main.py
