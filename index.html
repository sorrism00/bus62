    // 멀티 프록시를 통한 안정적인 HTML 패치 함수
    async function fetchWithCorsProxy(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
      ];

      for (let proxyUrl of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000); // 6초 타임아웃
          
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (response.ok) {
            const text = await response.text();
            if (text && text.length > 100) return text; // 유효한 HTML 내용 확인
          }
        } catch (e) {
          // 다음 프록시로 자동 우회
        }
      }
      return "";
    }

    // 메인 데이터 가져오기 및 파싱 프로세스
    async function fetchBusData() {
      const loadingEl = document.getElementById('loadingOverlay');
      const refreshIcon = document.getElementById('refreshIcon');
      
      loadingEl.style.opacity = '1';
      loadingEl.style.pointerEvents = 'auto';
      refreshIcon.classList.add('fa-spin');

      try {
        // 1. 노선 전체 상세 정보(위치 및 구간 속도) 가져오기
        const detailUrl = `https://m.map.kakao.com/actions/busDetailInfo?busId=${BUS_ID}`;
        const detailHtml = await fetchWithCorsProxy(detailUrl);

        const busDataMap = {};
        const speedDataMap = {};

        if (detailHtml) {
          // 버스 현위치 파싱
          const regex = /<span class="ico_businfo bus_0101">([^<]+)<\/span>[\s\S]*?<span class="txt_bus bus_info_txt">(\d+)<\/span>[\s\S]*?<span class="screen_out">[^<]*버스 정류장 번호\s*:\s*(\d+)<\/span>/g;
          let match;
          while ((match = regex.exec(detailHtml)) !== null) {
            const busCate = match[1] ? match[1].trim() : "일반";
            const busNum = match[2] ? match[2].trim() : "";
            const stationId = match[3] ? match[3].trim() : null;
            if (stationId) {
              const formattedText = `${busNum}\n(${busCate})`;
              busDataMap[stationId] = busDataMap[stationId] ? busDataMap[stationId] + ", " + formattedText : formattedText;
            }
          }

          // 구간 속도(혼잡도) 파싱
          const speedRegex = /<li[^>]*data-id="(\d+)"[\s\S]*?<div class="before_speed\s*([^"]*)">[\s\S]*?<div class="after_speed\s*([^"]*)">/g;
          let speedMatch;
          while ((speedMatch = speedRegex.exec(detailHtml)) !== null) {
            speedDataMap[speedMatch[1].trim()] = {
              before: speedMatch[2].trim(),
              after: speedMatch[3].trim()
            };
          }
        }

        // 2. 블록 1, 블록 2 데이터 병렬 스크래핑 처리
        const processedBlock1 = await processStationBlock(BLOCK1_STATIONS, busDataMap, speedDataMap);
        const processedBlock2 = await processStationBlock(BLOCK2_STATIONS, busDataMap, speedDataMap);

        // 3. 렌더링 반영
        renderList('block1List', processedBlock1, 'b1Count', false);
        renderList('block2List', processedBlock2, 'b2Count', true);

        const now = new Date();
        document.getElementById('lastUpdated').innerText = now.toLocaleTimeString('ko-KR');

      } catch (err) {
        console.error("데이터 갱신 중 오류:", err);
      } finally {
        loadingEl.style.opacity = '0';
        loadingEl.style.pointerEvents = 'none';
        refreshIcon.classList.remove('fa-spin');
      }
    }

    // 각 정류장별 상세 도착 정보 스크래핑 및 구간 계산
    async function processStationBlock(stations, busDataMap, speedDataMap) {
      const results = [];
      const colorMap = { "green": "#34A853", "yellow": "#FBBC05", "red": "#EA4335", "grey": "#9AA0A6", "gray": "#9AA0A6" };

      // 부하 분산 및 안정성을 위해 순차적으로 정류장 정보 요청 처리
      for (let station of stations) {
        const stationUrl = `https://m.map.kakao.com/actions/busStationInfo?busStopId=${station.stopId}&busId=${BUS_ID}&busOrder=${station.order}&_=${new Date().getTime()}`;
        const html = await fetchWithCorsProxy(stationUrl);
        const arrivals = parseKakaoBusHtml(html, "62");

        const arrival1 = arrivals[0] ? (arrivals[0][0] + " " + arrivals[0][1]).trim() : "정보 없음";
        const arrival2 = arrivals[1] ? (arrivals[1][0] + " " + arrivals[1][1]).trim() : "";

        let speedInfo = speedDataMap[station.stationId] || { before: "", after: "" };
        let stationBg = colorMap[speedInfo.after] || null;
        let busLoc = busDataMap[station.stationId] || "";

        results.push({
          station: station.name,
          stationBg: stationBg,
          arrival: arrival1,
          arrivalBg: null,
          interval: arrival2,
          busLoc: busLoc
        });
      }
      return results;
    }

    // 카카오맵 HTML 파서 헬퍼
    function parseKakaoBusHtml(html, busNo) {
      try {
        const allBlocks = html.match(/<a[^>]*class="link_result"[\s\S]*?<\/a>/g);
        if (!allBlocks) return [];

        const targetBlock = allBlocks.find(block => {
          const checkRegex = new RegExp('\\s*' + busNo + '\\s*<\\/strong>');
          return checkRegex.test(block);
        });
        if (!targetBlock) return [];

        const results = [];
        const situationRegex = /<span class="[^"]*(?:txt_situation|txt_state)[^"]*">([\s\S]*?)<\/span>/g;
        let match;

        while ((match = situationRegex.exec(targetBlock)) !== null) {
          let info = match[1].replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
          if (info) {
            if (info.includes("곧도착")) info = info.replace("곧도착", "곧 도착");
            const timeMatch = info.match(/(.*?)\s*\(\d+번째 전\)/);
            if (timeMatch) {
              const numMatch = info.match(/(\d+)번째 전/);
              results.push([timeMatch[1].trim(), `(${numMatch ? numMatch[1] : ""})`]);
            } else {
              results.push([info, ""]);
            }
          }
        }
        return results;
      } catch (e) {
        return [["정보 없음", ""]];
      }
    }

    // UI 렌더링 함수

        return;
      }

      let html = '';

        const stationStyle = getCustomBgStyle(row.stationBg);
        
        let busBadge = '';
        if (row.busLoc) {
          const cleanBusLoc = row.busLoc.replace(/\n/g, '');

          const isSpecial = specialStations.some(s => row.station && row.station.trim().includes(s));
          
          if (isSpecial) {
            busBadge = `<span class="inline-block bg-black text-yellow-300 font-bold px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] border border-yellow-400 shadow">${cleanBusLoc}</span>`;
          } else {
            busBadge = `<span class="inline-block bg-white text-slate-900 font-bold px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] border border-slate-300 shadow-sm">${cleanBusLoc}</span>`;
          }
        }

        const borderStations = ["동인천역", "정부인천지방합동청사", "간석북부역·우성1차", "서창동화원(캠퍼스)", "인수초등학교(터미널)", "간석오거리역(8번출구)"];
        const isBorder = row.station && borderStations.some(s => {
          if (isBlock2 && s === "간석북부역·우성1차") return false;
          return row.station.trim() === s;
        });
        const rowBorderStyle = isBorder ? 'border-4 border-black z-10 relative font-extrabold my-1 rounded-sm' : 'border-b border-slate-200';

        html += `
          <div class="grid sheet-grid items-stretch text-center hover:bg-slate-50 transition-colors ${rowBorderStyle} h-9">
            <div class="flex items-center justify-center px-1 font-bold text-slate-800 border-r border-slate-200 truncate ${stationStyle}">
              <span class="text-[11px] sm:text-xs tracking-tight truncate px-0.5">${row.station || ''}</span>
            </div>
            <div class="flex items-center justify-center px-1 font-semibold text-xs whitespace-nowrap border-r border-slate-200">
              <span class="truncate">${row.arrival || ''}</span>
            </div>
            <div class="flex items-center justify-center px-1 text-xs text-slate-700 whitespace-nowrap border-r border-slate-200">
              <div>${row.interval || ''}</div>
            </div>
            <div class="flex items-center justify-center px-0.5 whitespace-nowrap">
              ${busBadge}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function getCustomBgStyle(hexColor) {
      if (!hexColor) return '';
      if (hexColor === '#34A853') return 'bg-emerald-500 text-white font-bold rounded';
      if (hexColor === '#FBBC05') return 'bg-yellow-300 text-slate-900 font-bold rounded';
      if (hexColor === '#EA4335') return 'bg-red-500 text-white font-bold rounded';
      return `style="background-color: ${hexColor};" rounded`;
    }

    let currentMobileTab = 1;
    function toggleMobileTab() {
      if (window.innerWidth >= 768) return;
      currentMobileTab = currentMobileTab === 1 ? 2 : 1;
      const b1 = document.getElementById('block1Container');
      const b2 = document.getElementById('block2Container');
      if (currentMobileTab === 1) {
        b1.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
        b2.className = "hidden md:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
      } else {
        b1.className = "hidden md:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
        b2.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
      }
    }
  </script>
</body>
</html>
